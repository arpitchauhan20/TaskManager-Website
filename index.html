<!DOCTYPE html>
<html lang="en" data-theme="indigo">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b11">
  <meta name="description"
    content="TaskFlow Pro — Executive task management, Resend automated email delivery, and Google Calendar sync.">
  <title>TaskFlow Pro | Executive Task Management & Automations</title>

  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <meta name="application-name" content="TaskFlow Pro">
  <meta property="og:site_name" content="TaskFlow Pro">
  <meta property="og:title" content="TaskFlow Pro">

  <!-- Google Identity Services for Direct Google Calendar Sync -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <!-- Brand verification header for Google OAuth Review Crawler -->
  <div id="app-verification-info" style="position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0;">
    <h1>TaskFlow Pro</h1>
    <p>TaskFlow Pro is an executive task management and Google Calendar sync application.</p>
  </div>
  <noscript>
    <div style="font-family: sans-serif; padding: 2rem; text-align: center; color: #fff; background: #0b0f19;">
      <h1>TaskFlow Pro</h1>
      <p>TaskFlow Pro — Executive task management and Google Calendar sync.</p>
    </div>
  </noscript>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
