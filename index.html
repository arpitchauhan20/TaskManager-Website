<!DOCTYPE html>
<html lang="en" data-theme="indigo">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b11">
  <meta name="description"
    content="Techy Tool: Executive task management, Resend automated email delivery, and Google Calendar sync.">
  <title>Techy Tool | Executive Task &amp; Calendar</title>

  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <meta name="application-name" content="Techy Tool">
  <meta property="og:site_name" content="Techy Tool">
  <meta property="og:title" content="Techy Tool: Executive Task &amp; Calendar">
  <meta property="og:description" content="Executive task management, Google Calendar synchronization, and automated email reminders.">
  <meta name="google-site-verification" content="8dH5hOafaaGRP7biubnOms_2aKKZb7GJk00LiNtMbTU">

  <!-- Google Identity Services for Direct Google Calendar Sync -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div id="root">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #06080e;
        color: #f8fafc;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      .smart-preloader {
        position: fixed;
        inset: 0;
        background: #06080e;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 20px;
        z-index: 999999;
      }
      .preloader-glow-orb {
        position: absolute;
        width: 380px;
        height: 380px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.28) 0%, rgba(168, 85, 247, 0.12) 45%, transparent 70%);
        border-radius: 50%;
        filter: blur(60px);
        pointer-events: none;
        animation: preloaderPulse 3s ease-in-out infinite alternate;
      }
      @keyframes preloaderPulse {
        0% { transform: scale(0.9); opacity: 0.5; }
        100% { transform: scale(1.15); opacity: 0.85; }
      }
      .preloader-card {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 16px;
        padding: 32px 40px;
        background: rgba(13, 19, 33, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 24px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), 0 0 30px rgba(99, 102, 241, 0.15);
      }
      .preloader-logo-ring {
        position: relative;
        width: 60px;
        height: 60px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .preloader-spinner-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #6366f1;
        border-right-color: #a855f7;
        animation: preloaderSpin 1s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      }
      .preloader-logo-core {
        width: 44px;
        height: 44px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.5);
      }
      @keyframes preloaderSpin {
        to { transform: rotate(360deg); }
      }
      .preloader-title-row {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .preloader-title {
        font-size: 20px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.02em;
        margin: 0;
      }
      .preloader-tag {
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.08em;
        background: linear-gradient(135deg, #6366f1, #ec4899);
        color: #ffffff;
        padding: 2px 6px;
        border-radius: 4px;
      }
      .preloader-bar-track {
        width: 180px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
      }
      .preloader-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 45%;
        background: linear-gradient(90deg, #6366f1, #a855f7, #ec4899);
        border-radius: 9999px;
        animation: preloaderBar 1.4s ease-in-out infinite;
      }
      @keyframes preloaderBar {
        0% { left: -45%; }
        100% { left: 100%; }
      }
      .preloader-status {
        font-size: 12px;
        color: #94a3b8;
        letter-spacing: 0.02em;
        font-weight: 500;
      }
    </style>
    <div class="smart-preloader">
      <div class="preloader-glow-orb"></div>
      <div class="preloader-card">
        <div class="preloader-logo-ring">
          <div class="preloader-spinner-ring"></div>
          <div class="preloader-logo-core">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
          </div>
        </div>
        <div class="preloader-title-row">
          <span class="preloader-title">TaskFlow</span>
          <span class="preloader-tag">PRO</span>
        </div>
        <div class="preloader-bar-track">
          <div class="preloader-bar-fill"></div>
        </div>
        <span class="preloader-status">Loading workspace...</span>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
