<!DOCTYPE html>
<html lang="en" data-theme="indigo">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#080b11">
  <meta name="description"
    content="Techy Tool: Executive task management, Resend automated email delivery, and Google Calendar sync.">
  <title>Techy Tool | Executive Task &amp; Calendar</title>

  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" type="image/png" href="/icons/icon-192.png">

  <!-- Google Fonts: Plus Jakarta Sans & JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet">
  <meta name="application-name" content="Techy Tool">
  <meta property="og:site_name" content="Techy Tool">
  <meta property="og:title" content="Techy Tool: Executive Task &amp; Calendar">
  <meta property="og:description" content="Executive task management, Google Calendar synchronization, and automated email reminders.">
  <meta name="google-site-verification" content="8dH5hOafaaGRP7biubnOms_2aKKZb7GJk00LiNtMbTU">

  <!-- Google Identity Services for Direct Google Calendar Sync -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>
  <div id="root">
    <style>
      body {
        margin: 0;
        padding: 0;
        background-color: #05070d;
        color: #f8fafc;
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        overflow: hidden;
      }
      .techy-preloader {
        position: fixed;
        inset: 0;
        background: radial-gradient(circle at 50% 40%, #0a0f1d 0%, #05070d 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 999999;
      }
      /* Perspective Cyber Grid Background */
      .techy-preloader-grid {
        position: absolute;
        inset: 0;
        background-image: 
          linear-gradient(to right, rgba(99, 102, 241, 0.05) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(99, 102, 241, 0.05) 1px, transparent 1px);
        background-size: 32px 32px;
        mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.8) 0%, transparent 75%);
        -webkit-mask-image: radial-gradient(ellipse at center, rgba(0,0,0,0.8) 0%, transparent 75%);
        pointer-events: none;
      }
      .techy-preloader-orb {
        position: absolute;
        width: 440px;
        height: 440px;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.35) 0%, rgba(6, 182, 212, 0.2) 40%, transparent 70%);
        border-radius: 50%;
        filter: blur(80px);
        pointer-events: none;
        animation: techyOrbPulse 3.5s ease-in-out infinite alternate;
      }
      @keyframes techyOrbPulse {
        0% { transform: scale(0.85); opacity: 0.45; }
        100% { transform: scale(1.2); opacity: 0.85; }
      }
      .techy-preloader-box {
        position: relative;
        z-index: 2;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 20px;
        padding: 40px 48px;
        background: rgba(10, 14, 26, 0.72);
        border: 1px solid rgba(255, 255, 255, 0.12);
        border-radius: 28px;
        backdrop-filter: blur(28px);
        -webkit-backdrop-filter: blur(28px);
        box-shadow: 0 25px 65px -10px rgba(0, 0, 0, 0.75), 0 0 40px rgba(99, 102, 241, 0.2);
        animation: techyBoxAppear 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      @keyframes techyBoxAppear {
        from { opacity: 0; transform: translateY(14px) scale(0.96); }
        to { opacity: 1; transform: translateY(0) scale(1); }
      }
      /* Dual Orbit Cyber Rings */
      .techy-orbital-wrap {
        position: relative;
        width: 80px;
        height: 80px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .techy-ring-outer {
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        border: 2px dashed rgba(6, 182, 212, 0.45);
        animation: techySpinCW 8s linear infinite;
      }
      .techy-ring-inner {
        position: absolute;
        inset: 2px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-top-color: #6366f1;
        border-right-color: #ec4899;
        animation: techySpinCCW 1.2s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite;
      }
      .techy-logo-core {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #06b6d4 100%);
        color: #ffffff;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 0 25px rgba(99, 102, 241, 0.6);
        position: relative;
        z-index: 3;
      }
      @keyframes techySpinCW {
        to { transform: rotate(360deg); }
      }
      @keyframes techySpinCCW {
        to { transform: rotate(-360deg); }
      }
      .techy-brand-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
      }
      .techy-brand-title {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 24px;
        font-weight: 800;
        color: #ffffff;
        letter-spacing: -0.03em;
        margin: 0;
      }
      .techy-brand-tag {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        background: linear-gradient(135deg, #6366f1, #06b6d4);
        color: #ffffff;
        padding: 2px 8px;
        border-radius: 6px;
        box-shadow: 0 0 12px rgba(6, 182, 212, 0.35);
      }
      .techy-brand-subtitle {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.12em;
        color: #818cf8;
      }
      /* Telemetry Scan Bar */
      .techy-bar-track {
        width: 200px;
        height: 4px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 9999px;
        overflow: hidden;
        position: relative;
        box-shadow: inset 0 1px 2px rgba(0, 0, 0, 0.5);
      }
      .techy-bar-fill {
        position: absolute;
        top: 0;
        left: 0;
        bottom: 0;
        width: 40%;
        background: linear-gradient(90deg, #6366f1, #06b6d4, #ec4899);
        border-radius: 9999px;
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.7);
        animation: techyScan 1.2s ease-in-out infinite;
      }
      @keyframes techyScan {
        0% { left: -40%; }
        100% { left: 100%; }
      }
      .techy-telemetry-text {
        font-size: 12px;
        color: #94a3b8;
        letter-spacing: 0.03em;
        font-weight: 500;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .techy-telemetry-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #10b981;
        box-shadow: 0 0 8px #10b981;
        animation: techyBlink 1s infinite alternate;
      }
      @keyframes techyBlink {
        0% { opacity: 0.4; }
        100% { opacity: 1; }
      }
    </style>
    <div class="techy-preloader">
      <div class="techy-preloader-grid"></div>
      <div class="techy-preloader-orb"></div>
      <div class="techy-preloader-box">
        <div class="techy-orbital-wrap">
          <div class="techy-ring-outer"></div>
          <div class="techy-ring-inner"></div>
          <div class="techy-logo-core">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
              <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />
            </svg>
          </div>
        </div>
        <div class="techy-brand-wrap">
          <div class="techy-brand-title">
            <span>Techy Tool</span>
            <span class="techy-brand-tag">PRO</span>
          </div>
          <span class="techy-brand-subtitle">Smart Automations &amp; Helping Tools</span>
        </div>
        <div class="techy-bar-track">
          <div class="techy-bar-fill"></div>
        </div>
        <div class="techy-telemetry-text">
          <span class="techy-telemetry-dot"></span>
          <span>Loading automation tools...</span>
        </div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
